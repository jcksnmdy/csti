<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="milc-t milc-d"><title id="milc-t">Controls MiL</title><desc id="milc-d">On one desktop, RoadRunner Scenario gives its objects straight to the Simulink controllers as unprocessed ground truth; the controllers command the Simulink vehicle model, whose pose goes back to RoadRunner.</desc><style>
svg{--text:#1d2125;--muted:#5b636b;--line:#d9dcdf;--surface:#fff;--bg:#fbfbf9;--code-bg:#f1f2f3;
--accent:#8a1c2b;--accent-soft:#f6e9eb;--accent2:#c25e00;--proposed-bg:#fdeedc;--safety:#8a1c2b;--safety-bg:#fbe9ec;color:#1d2125;background:#fff}
@media (prefers-color-scheme: dark){svg{--text:#e6e8ea;--muted:#a3abb3;--line:#353a40;--surface:#1d2024;--bg:#15171a;
--code-bg:#262a2f;--accent:#e0848f;--accent-soft:#2d1f22;--accent2:#f0a35c;--proposed-bg:#33261a;--safety:#f09aa4;--safety-bg:#33201f;color:#e6e8ea;background:#1d2024}}
.dg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12px;fill:var(--text)}
.dg .box{fill:var(--surface);stroke:var(--text);stroke-width:1.2}
.dg .sub{fill:var(--bg);stroke:var(--muted);stroke-width:1}
.dg .ext{fill:var(--code-bg);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 3}
.dg .sys{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.dg .safe{fill:var(--safety-bg);stroke:var(--safety);stroke-width:1.6}
.dg .frozen{fill:var(--proposed-bg);stroke:var(--accent2);stroke-width:2.4}
.dg .lane{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.dg .lanet{font-size:11px;fill:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.dg .ln{stroke:var(--text);fill:none;stroke-width:1.2}
.dg .ln.dash{stroke-dasharray:5 4}.dg .ln.red{stroke:var(--safety)}.dg .ln.thin{stroke:var(--muted)}
.dg .lbl{font-size:11px;fill:var(--muted)}.dg .lbl-bg{fill:var(--surface)}
.dg .st{font-size:10.5px;fill:var(--muted);font-style:italic}.dg .id{font-weight:700}
.dg .act{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.dg .frag{fill:none;stroke:var(--muted);stroke-width:1}.dg .fragt{fill:var(--code-bg);stroke:var(--muted);stroke-width:1}
.dg .state{fill:var(--surface);stroke:var(--text);stroke-width:1.3}.dg .dot{fill:var(--text)}
</style><defs><marker id="milc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="milc-arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="currentColor"/></marker><marker id="milc-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="currentColor" stroke-width="1.4"/></marker><marker id="milc-opens" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="currentColor" stroke-width="1.4"/></marker></defs><path class="box" d="M20,50 L32,38 L992,38 L980,50 Z"/>
<path class="box" d="M980,50 L992,38 L992,268 L980,280 Z"/>
<rect class="box" x="20" y="50" width="960" height="230" rx="0"/>
<text class="st" x="500.0" y="68" text-anchor="middle">«device»</text>
<text class="id" x="500.0" y="84" text-anchor="middle">Desktop workstation</text>
<rect class="box" x="50" y="100" width="230" height="90" rx="4"/>
<text x="165.0" y="135.5" text-anchor="middle">RoadRunner Scenario</text>
<text class="st" x="165.0" y="150.5" text-anchor="middle">actors; objects as</text>
<text class="st" x="165.0" y="163.5" text-anchor="middle">ground truth</text>
<rect class="box" x="385" y="100" width="230" height="90" rx="4"/>
<text x="500.0" y="142.0" text-anchor="middle">Simulink controllers</text>
<text class="st" x="500.0" y="157.0" text-anchor="middle">ACC, LCC, AIN</text>
<rect class="box" x="720" y="100" width="230" height="90" rx="4"/>
<text x="835.0" y="142.0" text-anchor="middle">Simulink vehicle model</text>
<text class="st" x="835.0" y="157.0" text-anchor="middle">vehicle dynamics</text>
<path class="ln" d="M280,145 L385,145" marker-end="url(#milc-arr)"/>
<path class="ln" d="M615,145 L720,145" marker-end="url(#milc-arr)"/>
<path class="ln" d="M835,190 L835,225 L165,225 L165,190" marker-end="url(#milc-arr)"/>
<rect class="lbl-bg" x="641.0" y="126" width="52.0" height="13"/>
<text class="lbl" x="667" y="136" text-anchor="middle">commands</text>
<rect class="lbl-bg" x="308.8" y="126" width="46.5" height="13"/>
<text class="lbl" x="332" y="136" text-anchor="middle">objects</text>
<rect class="lbl-bg" x="474.0" y="219" width="52.0" height="13"/>
<text class="lbl" x="500" y="229" text-anchor="middle">ego pose</text>
<text class="st" x="500" y="262" text-anchor="middle">Objects come straight from RoadRunner, unprocessed. No fusion and no safety interlock.</text></svg>