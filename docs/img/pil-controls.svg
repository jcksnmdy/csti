<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="pilc-t pilc-d"><title id="pilc-t">Controls PiL</title><desc id="pilc-d">The desktop runs RoadRunner Scenario and the Simulink vehicle model and publishes ground truth over ROS 2 to the code-generated C++ controller nodes on the AUTERA, which send commands back.</desc><style>
svg{--text:#1d2125;--muted:#5b636b;--line:#d9dcdf;--surface:#fff;--bg:#fbfbf9;--code-bg:#f1f2f3;
--accent:#8a1c2b;--accent-soft:#f6e9eb;--accent2:#c25e00;--proposed-bg:#fdeedc;--safety:#8a1c2b;--safety-bg:#fbe9ec;color:#1d2125;background:#fff}
@media (prefers-color-scheme: dark){svg{--text:#e6e8ea;--muted:#a3abb3;--line:#353a40;--surface:#1d2024;--bg:#15171a;
--code-bg:#262a2f;--accent:#e0848f;--accent-soft:#2d1f22;--accent2:#f0a35c;--proposed-bg:#33261a;--safety:#f09aa4;--safety-bg:#33201f;color:#e6e8ea;background:#1d2024}}
.dg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12px;fill:var(--text)}
.dg .box{fill:var(--surface);stroke:var(--text);stroke-width:1.2}
.dg .sub{fill:var(--bg);stroke:var(--muted);stroke-width:1}
.dg .ext{fill:var(--code-bg);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 3}
.dg .sys{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.dg .safe{fill:var(--safety-bg);stroke:var(--safety);stroke-width:1.6}
.dg .frozen{fill:var(--proposed-bg);stroke:var(--accent2);stroke-width:2.4}
.dg .lane{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.dg .lanet{font-size:11px;fill:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.dg .ln{stroke:var(--text);fill:none;stroke-width:1.2}
.dg .ln.dash{stroke-dasharray:5 4}.dg .ln.red{stroke:var(--safety)}.dg .ln.thin{stroke:var(--muted)}
.dg .lbl{font-size:11px;fill:var(--muted)}.dg .lbl-bg{fill:var(--surface)}
.dg .st{font-size:10.5px;fill:var(--muted);font-style:italic}.dg .id{font-weight:700}
.dg .act{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.dg .frag{fill:none;stroke:var(--muted);stroke-width:1}.dg .fragt{fill:var(--code-bg);stroke:var(--muted);stroke-width:1}
.dg .state{fill:var(--surface);stroke:var(--text);stroke-width:1.3}.dg .dot{fill:var(--text)}
</style><defs><marker id="pilc-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="pilc-arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="currentColor"/></marker><marker id="pilc-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="currentColor" stroke-width="1.4"/></marker><marker id="pilc-opens" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="currentColor" stroke-width="1.4"/></marker></defs><path class="box" d="M20,50 L32,38 L472,38 L460,50 Z"/>
<path class="box" d="M460,50 L472,38 L472,288 L460,300 Z"/>
<rect class="box" x="20" y="50" width="440" height="250" rx="0"/>
<text class="st" x="240.0" y="68" text-anchor="middle">«device»</text>
<text class="id" x="240.0" y="84" text-anchor="middle">Desktop workstation</text>
<rect class="box" x="45" y="95" width="190" height="80" rx="4"/>
<text x="140.0" y="132.0" text-anchor="middle">RoadRunner Scenario</text>
<text class="st" x="140.0" y="147.0" text-anchor="middle">actors, ground truth</text>
<rect class="box" x="250" y="95" width="190" height="80" rx="4"/>
<text x="345.0" y="132.0" text-anchor="middle">Simulink vehicle model</text>
<text class="st" x="345.0" y="147.0" text-anchor="middle">vehicle dynamics</text>
<rect class="box" x="45" y="200" width="395" height="60" rx="4"/>
<text x="242.5" y="227.0" text-anchor="middle">ROS 2 publisher</text>
<text class="st" x="242.5" y="242.0" text-anchor="middle">ego odometry and actor positions</text>
<path class="box" d="M540,50 L552,38 L992,38 L980,50 Z"/>
<path class="box" d="M980,50 L992,38 L992,288 L980,300 Z"/>
<rect class="box" x="540" y="50" width="440" height="250" rx="0"/>
<text class="st" x="760.0" y="68" text-anchor="middle">«device»</text>
<text class="id" x="760.0" y="84" text-anchor="middle">AUTERA AutoBox</text>
<rect class="box" x="565" y="95" width="390" height="90" rx="4"/>
<text x="760.0" y="130.5" text-anchor="middle">C++ controller nodes</text>
<text class="st" x="760.0" y="145.5" text-anchor="middle">one per controller (ACC, LCC, AIN),</text>
<text class="st" x="760.0" y="158.5" text-anchor="middle">code-generated from Simulink</text>
<text class="st" x="760" y="275" text-anchor="middle">No fusion: the controllers receive ground truth.</text>
<path class="ln" d="M235,135 L250,135" marker-end="url(#pilc-arr)" marker-start="url(#pilc-arrs)"/>
<path class="ln" d="M140,175 L140,200" marker-end="url(#pilc-arr)"/>
<path class="ln" d="M345,175 L345,200" marker-end="url(#pilc-arr)"/>
<path class="ln" d="M440,230 L660,230 L660,185" marker-end="url(#pilc-arr)"/>
<path class="ln" d="M565,160 L440,160" marker-end="url(#pilc-arr)"/>
<rect class="lbl-bg" x="501.0" y="240" width="118.0" height="13"/>
<text class="lbl" x="560" y="250" text-anchor="middle">ground truth (ROS 2)</text>
<rect class="lbl-bg" x="455.0" y="144" width="96.0" height="13"/>
<text class="lbl" x="503" y="154" text-anchor="middle">commands (ROS 2)</text></svg>