<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="cmp-t cmp-d"><title id="cmp-t">Component diagram</title><desc id="cmp-d">CSTI&#x27;s goals as blocks. Main flow left to right: define and check the test, run it, simulate the world, make sensor data, deliver it to the autonomy stack. Underneath: recording and judging, and vehicle placement and time.</desc><style>
svg{--text:#1d2125;--muted:#5b636b;--line:#d9dcdf;--surface:#fff;--bg:#fbfbf9;--code-bg:#f1f2f3;
--accent:#8a1c2b;--accent-soft:#f6e9eb;--accent2:#c25e00;--proposed-bg:#fdeedc;--safety:#8a1c2b;--safety-bg:#fbe9ec;color:#1d2125;background:#fff}
@media (prefers-color-scheme: dark){svg{--text:#e6e8ea;--muted:#a3abb3;--line:#353a40;--surface:#1d2024;--bg:#15171a;
--code-bg:#262a2f;--accent:#e0848f;--accent-soft:#2d1f22;--accent2:#f0a35c;--proposed-bg:#33261a;--safety:#f09aa4;--safety-bg:#33201f;color:#e6e8ea;background:#1d2024}}
.dg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12px;fill:var(--text)}
.dg .box{fill:var(--surface);stroke:var(--text);stroke-width:1.2}
.dg .sub{fill:var(--bg);stroke:var(--muted);stroke-width:1}
.dg .ext{fill:var(--code-bg);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 3}
.dg .sys{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.dg .safe{fill:var(--safety-bg);stroke:var(--safety);stroke-width:1.6}
.dg .frozen{fill:var(--proposed-bg);stroke:var(--accent2);stroke-width:2.4}
.dg .lane{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.dg .lanet{font-size:11px;fill:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.dg .ln{stroke:var(--text);fill:none;stroke-width:1.2}
.dg .ln.dash{stroke-dasharray:5 4}.dg .ln.red{stroke:var(--safety)}.dg .ln.thin{stroke:var(--muted)}
.dg .lbl{font-size:11px;fill:var(--muted)}.dg .lbl-bg{fill:var(--surface)}
.dg .st{font-size:10.5px;fill:var(--muted);font-style:italic}.dg .id{font-weight:700}
.dg .act{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.dg .frag{fill:none;stroke:var(--muted);stroke-width:1}.dg .fragt{fill:var(--code-bg);stroke:var(--muted);stroke-width:1}
.dg .state{fill:var(--surface);stroke:var(--text);stroke-width:1.3}.dg .dot{fill:var(--text)}
</style><defs><marker id="cmp-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="cmp-arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="currentColor"/></marker><marker id="cmp-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="currentColor" stroke-width="1.4"/></marker><marker id="cmp-opens" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="currentColor" stroke-width="1.4"/></marker></defs><rect class="ext" x="400" y="10" width="170" height="50" rx="4"/>
<text class="st" x="485.0" y="32.5" text-anchor="middle">«external»</text>
<text x="485.0" y="44.5" text-anchor="middle">Simulation tools</text>
<rect class="box" x="20" y="110" width="170" height="110" rx="4"/>
<text x="105.0" y="148.0" text-anchor="middle">Define and check</text>
<text x="105.0" y="163.0" text-anchor="middle">the test</text>
<text class="st" x="105.0" y="178.0" text-anchor="middle">scenario authoring;</text>
<text class="st" x="105.0" y="191.0" text-anchor="middle">schema + ODD checks</text>
<rect class="box" x="210" y="110" width="170" height="110" rx="4"/>
<text x="295.0" y="155.5" text-anchor="middle">Run the test</text>
<text class="st" x="295.0" y="170.5" text-anchor="middle">stage profile, start/stop,</text>
<text class="st" x="295.0" y="183.5" text-anchor="middle">campaigns</text>
<rect class="box" x="400" y="110" width="170" height="110" rx="4"/>
<text x="485.0" y="155.5" text-anchor="middle">Simulate the world</text>
<text class="st" x="485.0" y="170.5" text-anchor="middle">simulators, actors,</text>
<text class="st" x="485.0" y="183.5" text-anchor="middle">triggers</text>
<rect class="box" x="590" y="110" width="170" height="110" rx="4"/>
<text x="675.0" y="155.5" text-anchor="middle">Make sensor data</text>
<text class="st" x="675.0" y="170.5" text-anchor="middle">sensor models,</text>
<text class="st" x="675.0" y="183.5" text-anchor="middle">fault injection</text>
<rect class="frozen" x="780" y="110" width="170" height="110" rx="4"/>
<text x="865.0" y="149.0" text-anchor="middle">Deliver to the stack</text>
<text class="st" x="865.0" y="164.0" text-anchor="middle">gateway on fusion&#x27;s</text>
<text class="st" x="865.0" y="177.0" text-anchor="middle">input topics;</text>
<text class="st" x="865.0" y="190.0" text-anchor="middle">frozen contract</text>
<path class="ln" d="M190,165 L210,165" marker-end="url(#cmp-arr)"/>
<path class="ln" d="M380,165 L400,165" marker-end="url(#cmp-arr)"/>
<path class="ln" d="M570,165 L590,165" marker-end="url(#cmp-arr)"/>
<path class="ln" d="M760,165 L780,165" marker-end="url(#cmp-arr)"/>
<path class="ln" d="M950,165 L970,165" marker-end="url(#cmp-arr)"/>
<rect class="ext" x="970" y="110" width="210" height="220" rx="4"/>
<text class="st" x="1075.0" y="178.5" text-anchor="middle">«external»</text>
<text x="1075.0" y="190.5" text-anchor="middle">Autonomy stack</text>
<text class="st" x="1075.0" y="205.5" text-anchor="middle">ingest + time sync</text>
<text class="st" x="1075.0" y="218.5" text-anchor="middle">object fusion</text>
<text class="st" x="1075.0" y="231.5" text-anchor="middle">planning</text>
<text class="st" x="1075.0" y="244.5" text-anchor="middle">state machines + fault detection</text>
<text class="st" x="1075.0" y="257.5" text-anchor="middle">safety interlock</text>
<text class="st" x="1075.0" y="270.5" text-anchor="middle">vehicle interface</text>
<path class="ln" d="M485,60 L485,110" marker-end="url(#cmp-arr)" marker-start="url(#cmp-arrs)"/>
<rect class="box" x="20" y="380" width="170" height="100" rx="4"/>
<text x="105.0" y="420.5" text-anchor="middle">Record and judge</text>
<text class="st" x="105.0" y="435.5" text-anchor="middle">recording + replay;</text>
<text class="st" x="105.0" y="448.5" text-anchor="middle">scoring vs ground truth</text>
<rect class="box" x="210" y="380" width="170" height="100" rx="4"/>
<text x="295.0" y="419.5" text-anchor="middle">Place the vehicle</text>
<text x="295.0" y="434.5" text-anchor="middle">and keep time</text>
<text class="st" x="295.0" y="449.5" text-anchor="middle">ego state, clock</text>
<rect class="ext" x="970" y="380" width="210" height="100" rx="4"/>
<text class="st" x="1075.0" y="414.5" text-anchor="middle">«external»</text>
<text x="1075.0" y="426.5" text-anchor="middle">Vehicle platform</text>
<text class="st" x="1075.0" y="441.5" text-anchor="middle">sensors, actuation gateway,</text>
<text class="st" x="1075.0" y="454.5" text-anchor="middle">override, E-stop</text>
<path class="ln" d="M295,380 L295,300 L450,300 L450,220" marker-end="url(#cmp-arr)"/>
<path class="ln" d="M1075,330 L1075,380" marker-end="url(#cmp-arr)"/>
<path class="ln" d="M1075,480 L1075,525 L295,525 L295,480" marker-end="url(#cmp-arr)"/>
<text class="st" x="105" y="500" text-anchor="middle">taps every flow above</text></svg>