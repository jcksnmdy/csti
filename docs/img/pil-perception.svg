<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="pilp-t pilp-d"><title id="pilp-t">Perception PiL</title><desc id="pilp-d">AURELION on the desktop co-simulates the RoadRunner scenario and sends simulated sensor data to the AUTERA, where RTMaps time-syncs and preprocesses it and the C++ object fusion runs in ROS 2.</desc><style>
svg{--text:#1d2125;--muted:#5b636b;--line:#d9dcdf;--surface:#fff;--bg:#fbfbf9;--code-bg:#f1f2f3;
--accent:#8a1c2b;--accent-soft:#f6e9eb;--accent2:#c25e00;--proposed-bg:#fdeedc;--safety:#8a1c2b;--safety-bg:#fbe9ec;color:#1d2125;background:#fff}
@media (prefers-color-scheme: dark){svg{--text:#e6e8ea;--muted:#a3abb3;--line:#353a40;--surface:#1d2024;--bg:#15171a;
--code-bg:#262a2f;--accent:#e0848f;--accent-soft:#2d1f22;--accent2:#f0a35c;--proposed-bg:#33261a;--safety:#f09aa4;--safety-bg:#33201f;color:#e6e8ea;background:#1d2024}}
.dg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12px;fill:var(--text)}
.dg .box{fill:var(--surface);stroke:var(--text);stroke-width:1.2}
.dg .sub{fill:var(--bg);stroke:var(--muted);stroke-width:1}
.dg .ext{fill:var(--code-bg);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 3}
.dg .sys{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.dg .safe{fill:var(--safety-bg);stroke:var(--safety);stroke-width:1.6}
.dg .frozen{fill:var(--proposed-bg);stroke:var(--accent2);stroke-width:2.4}
.dg .lane{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.dg .lanet{font-size:11px;fill:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.dg .ln{stroke:var(--text);fill:none;stroke-width:1.2}
.dg .ln.dash{stroke-dasharray:5 4}.dg .ln.red{stroke:var(--safety)}.dg .ln.thin{stroke:var(--muted)}
.dg .lbl{font-size:11px;fill:var(--muted)}.dg .lbl-bg{fill:var(--surface)}
.dg .st{font-size:10.5px;fill:var(--muted);font-style:italic}.dg .id{font-weight:700}
.dg .act{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.dg .frag{fill:none;stroke:var(--muted);stroke-width:1}.dg .fragt{fill:var(--code-bg);stroke:var(--muted);stroke-width:1}
.dg .state{fill:var(--surface);stroke:var(--text);stroke-width:1.3}.dg .dot{fill:var(--text)}
</style><defs><marker id="pilp-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="pilp-arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="currentColor"/></marker><marker id="pilp-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="currentColor" stroke-width="1.4"/></marker><marker id="pilp-opens" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="currentColor" stroke-width="1.4"/></marker></defs><path class="box" d="M20,50 L32,38 L432,38 L420,50 Z"/>
<path class="box" d="M420,50 L432,38 L432,288 L420,300 Z"/>
<rect class="box" x="20" y="50" width="400" height="250" rx="0"/>
<text class="st" x="220.0" y="68" text-anchor="middle">«device»</text>
<text class="id" x="220.0" y="84" text-anchor="middle">Desktop workstation (VEOS)</text>
<rect class="box" x="45" y="95" width="350" height="60" rx="4"/>
<text x="220.0" y="122.0" text-anchor="middle">RoadRunner Scenario</text>
<text class="st" x="220.0" y="137.0" text-anchor="middle">scene and actors</text>
<rect class="box" x="45" y="185" width="350" height="80" rx="4"/>
<text x="220.0" y="215.5" text-anchor="middle">AURELION</text>
<text class="st" x="220.0" y="230.5" text-anchor="middle">realistic camera, radar, LiDAR,</text>
<text class="st" x="220.0" y="243.5" text-anchor="middle">ultrasonic data; sensor faults</text>
<path class="ln" d="M220,155 L220,185" marker-end="url(#pilp-arr)"/>
<path class="box" d="M540,50 L552,38 L992,38 L980,50 Z"/>
<path class="box" d="M980,50 L992,38 L992,288 L980,300 Z"/>
<rect class="box" x="540" y="50" width="440" height="250" rx="0"/>
<text class="st" x="760.0" y="68" text-anchor="middle">«device»</text>
<text class="id" x="760.0" y="84" text-anchor="middle">AUTERA AutoBox</text>
<rect class="ext" x="565" y="185" width="390" height="80" rx="4"/>
<text x="760.0" y="215.5" text-anchor="middle">RTMaps</text>
<text class="st" x="760.0" y="230.5" text-anchor="middle">time sync, camera preprocessing,</text>
<text class="st" x="760.0" y="243.5" text-anchor="middle">LiDAR sync + downsample</text>
<rect class="box" x="565" y="95" width="390" height="60" rx="4"/>
<text x="760.0" y="122.0" text-anchor="middle">Object fusion (C++, ROS 2)</text>
<text class="st" x="760.0" y="137.0" text-anchor="middle">tracked object list</text>
<path class="ln" d="M760,185 L760,155" marker-end="url(#pilp-arr)"/>
<path class="ln" d="M395,225 L565,225" marker-end="url(#pilp-arr)"/>
<rect class="lbl-bg" x="445.8" y="206" width="68.5" height="13"/>
<text class="lbl" x="480" y="216" text-anchor="middle">sensor data</text>
<text class="st" x="500" y="318" text-anchor="middle">How AURELION&#x27;s output reaches the AUTERA is to confirm.</text></svg>