<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" role="img" aria-labelledby="fus-t fus-d"><title id="fus-t">Sensor fusion pipeline</title><desc id="fus-d">Radar, camera and LiDAR data enter an ingest middleware that time-synchronizes every stream, preprocesses camera images and synchronizes and downsamples LiDAR point clouds. Time-aligned object lists then go to the C++ object fusion core in ROS 2. CSTI publishes virtual object lists on the same fusion input topics, mirrored on /virtual/.</desc><style>
svg{--text:#1d2125;--muted:#5b636b;--line:#d9dcdf;--surface:#fff;--bg:#fbfbf9;--code-bg:#f1f2f3;
--accent:#8a1c2b;--accent-soft:#f6e9eb;--accent2:#c25e00;--proposed-bg:#fdeedc;--safety:#8a1c2b;--safety-bg:#fbe9ec;color:#1d2125;background:#fff}
@media (prefers-color-scheme: dark){svg{--text:#e6e8ea;--muted:#a3abb3;--line:#353a40;--surface:#1d2024;--bg:#15171a;
--code-bg:#262a2f;--accent:#e0848f;--accent-soft:#2d1f22;--accent2:#f0a35c;--proposed-bg:#33261a;--safety:#f09aa4;--safety-bg:#33201f;color:#e6e8ea;background:#1d2024}}
.dg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:12px;fill:var(--text)}
.dg .box{fill:var(--surface);stroke:var(--text);stroke-width:1.2}
.dg .sub{fill:var(--bg);stroke:var(--muted);stroke-width:1}
.dg .ext{fill:var(--code-bg);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:5 3}
.dg .sys{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.dg .safe{fill:var(--safety-bg);stroke:var(--safety);stroke-width:1.6}
.dg .frozen{fill:var(--proposed-bg);stroke:var(--accent2);stroke-width:2.4}
.dg .lane{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
.dg .lanet{font-size:11px;fill:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.dg .ln{stroke:var(--text);fill:none;stroke-width:1.2}
.dg .ln.dash{stroke-dasharray:5 4}.dg .ln.red{stroke:var(--safety)}.dg .ln.thin{stroke:var(--muted)}
.dg .lbl{font-size:11px;fill:var(--muted)}.dg .lbl-bg{fill:var(--surface)}
.dg .st{font-size:10.5px;fill:var(--muted);font-style:italic}.dg .id{font-weight:700}
.dg .act{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.dg .frag{fill:none;stroke:var(--muted);stroke-width:1}.dg .fragt{fill:var(--code-bg);stroke:var(--muted);stroke-width:1}
.dg .state{fill:var(--surface);stroke:var(--text);stroke-width:1.3}.dg .dot{fill:var(--text)}
</style><defs><marker id="fus-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="fus-arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="currentColor"/></marker><marker id="fus-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="currentColor" stroke-width="1.4"/></marker><marker id="fus-opens" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10" fill="none" stroke="currentColor" stroke-width="1.4"/></marker></defs><rect class="box" x="20" y="75" width="130" height="60" rx="4"/>
<text class="st" x="85.0" y="96.0" text-anchor="middle">«sensor»</text>
<text x="85.0" y="108.0" text-anchor="middle">Radars</text>
<text class="st" x="85.0" y="123.0" text-anchor="middle">object level, CAN</text>
<rect class="box" x="20" y="185" width="130" height="60" rx="4"/>
<text class="st" x="85.0" y="206.0" text-anchor="middle">«sensor»</text>
<text x="85.0" y="218.0" text-anchor="middle">Camera</text>
<text class="st" x="85.0" y="233.0" text-anchor="middle">raw images</text>
<rect class="box" x="20" y="315" width="130" height="60" rx="4"/>
<text class="st" x="85.0" y="336.0" text-anchor="middle">«sensor»</text>
<text x="85.0" y="348.0" text-anchor="middle">LiDAR</text>
<text class="st" x="85.0" y="363.0" text-anchor="middle">point cloud</text>
<rect class="ext" x="180" y="20" width="320" height="400" rx="8"/>
<text class="st" x="340" y="42" text-anchor="middle">«ingest middleware»</text>
<text class="id" x="340" y="58" text-anchor="middle">Time sync + preprocessing</text>
<rect class="box" x="200" y="75" width="280" height="60" rx="4"/>
<text x="340.0" y="102.0" text-anchor="middle">Timestamp and synchronize</text>
<text class="st" x="340.0" y="117.0" text-anchor="middle">object lists pass through</text>
<rect class="box" x="200" y="170" width="280" height="90" rx="4"/>
<text x="340.0" y="205.5" text-anchor="middle">Preprocess + detect</text>
<text class="st" x="340.0" y="220.5" text-anchor="middle">camera preprocessing; detector on an</text>
<text class="st" x="340.0" y="233.5" text-anchor="middle">embedded GPU module or here (to confirm)</text>
<rect class="box" x="200" y="300" width="280" height="90" rx="4"/>
<text x="340.0" y="335.5" text-anchor="middle">Synchronize + downsample</text>
<text class="st" x="340.0" y="350.5" text-anchor="middle">LiDAR point cloud; clustering</text>
<text class="st" x="340.0" y="363.5" text-anchor="middle">into objects (location to confirm)</text>
<rect class="sys" x="560" y="20" width="300" height="400" rx="8"/>
<text class="st" x="710" y="42" text-anchor="middle">«C++ core in ROS 2»</text>
<text class="id" x="710" y="58" text-anchor="middle">Object fusion</text>
<rect class="box" x="580" y="80" width="260" height="48" rx="4"/>
<text x="710.0" y="107.5" text-anchor="middle">Transform to vehicle frame</text>
<rect class="box" x="580" y="160" width="260" height="48" rx="4"/>
<text x="710.0" y="187.5" text-anchor="middle">Association</text>
<path class="ln" d="M710,128 L710,160" marker-end="url(#fus-arr)"/>
<rect class="box" x="580" y="240" width="260" height="48" rx="4"/>
<text x="710.0" y="267.5" text-anchor="middle">Tracking filter</text>
<path class="ln" d="M710,208 L710,240" marker-end="url(#fus-arr)"/>
<rect class="box" x="580" y="320" width="260" height="48" rx="4"/>
<text x="710.0" y="347.5" text-anchor="middle">Track management</text>
<path class="ln" d="M710,288 L710,320" marker-end="url(#fus-arr)"/>
<rect class="box" x="890" y="310" width="150" height="64" rx="4"/>
<text x="965.0" y="338.0" text-anchor="middle">Fused object list</text>
<text x="965.0" y="353.0" text-anchor="middle">to planning</text>
<path class="ln" d="M840,344 L890,342" marker-end="url(#fus-arr)"/>
<path class="ln" d="M150,105 L200,105" marker-end="url(#fus-arr)"/>
<path class="ln" d="M150,215 L200,215" marker-end="url(#fus-arr)"/>
<path class="ln" d="M150,345 L200,345" marker-end="url(#fus-arr)"/>
<path class="ln" d="M480,105 L530,105"/>
<path class="ln" d="M480,215 L530,215"/>
<path class="ln" d="M480,345 L530,345"/>
<path class="ln thin" d="M530,104 L530,478"/>
<path class="ln" d="M530,104 L580,104" marker-end="url(#fus-arr)"/>
<rect class="lbl-bg" x="541.0" y="430" width="145.5" height="13"/>
<text class="lbl" x="545" y="440" text-anchor="start">time-aligned object lists</text>
<rect class="frozen" x="250" y="452" width="190" height="56" rx="4"/>
<text x="345.0" y="483.5" text-anchor="middle">CSTI gateway (ViL)</text>
<path class="ln dash" d="M440,478 L530,478"/>
<rect class="lbl-bg" x="541.0" y="460" width="310.5" height="13"/>
<text class="lbl" x="545" y="470" text-anchor="start">virtual object lists on the same topics, stamped on the</text>
<rect class="lbl-bg" x="541.0" y="474" width="261.0" height="13"/>
<text class="lbl" x="545" y="484" text-anchor="start">same time base; mirrored on /virtual/ for logs</text></svg>